services:
  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "80:80"

  api:
    profiles: ["api"]
    build:
      context: ./api
    restart: unless-stopped
    environment:
      NVH_API_DATABASE_URL: ${NVH_API_DATABASE_URL}
      NVH_API_REDIS_URL: ${NVH_API_REDIS_URL}
      NVH_API_OBJECT_STORAGE_URL: ${NVH_API_OBJECT_STORAGE_URL}
      NVH_API_KEY_PREFIX: ${NVH_API_KEY_PREFIX}

  ai-api:
    profiles: ["api"]
    build:
      context: ./ai-api
    restart: unless-stopped
    environment:
      AI_API_DATABASE_URL: ${AI_API_DATABASE_URL}
      AI_API_REDIS_URL: ${AI_API_REDIS_URL}
      AI_API_KEY_PREFIX: ${AI_API_KEY_PREFIX}

# forum.nvhtest.cn uses the official Discourse Docker installer.
# Keep Discourse outside this compose file so upgrades, backups, and mail setup
# follow the upstream operations model.
